<!doctype html><html lang="he"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>מסע המילים Our World</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one centered game column — header bar with score/streak, a big word card, answer tiles below */
:root{
  --bg:#E8F0FF; --paper:#FFFFFF; --ink:#1B2547; --muted:#5D6889; --line:#CFDAF2;
  --accent:#5B3FE0; --accent-soft:#ECE7FF; --good:#139A5E; --good-soft:#DDF6EA;
  --bad:#D93A45; --bad-soft:#FDE4E6; --gold:#F2A20C; --gold-soft:#FFF2D6;
  --display:"Fredoka","Rubik",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10162B; --paper:#1A2342; --ink:#E9EEFF; --muted:#A3AEcf; --line:#2C3863;
  --accent:#9C86FF; --accent-soft:#2A2560; --good:#3DD08E; --good-soft:#143A2C; --bad:#FF6F78; --bad-soft:#40202A;
  --gold:#FFC24D; --gold-soft:#3A2F14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10162B; --paper:#1A2342; --ink:#E9EEFF; --muted:#A3AEcf; --line:#2C3863;
  --accent:#9C86FF; --accent-soft:#2A2560; --good:#3DD08E; --good-soft:#143A2C; --bad:#FF6F78; --bad-soft:#40202A;
  --gold:#FFC24D; --gold-soft:#3A2F14; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--display)}
h1{font-family:var(--display);font-weight:700;font-size:2rem;margin:0;text-wrap:balance;line-height:1.1}
h1 .en{color:var(--accent)}
.sub{color:var(--muted);margin:0}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.label{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;background:var(--bg);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.bar{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:8px 14px;font:500 .95rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:12px;text-align:start;cursor:pointer;font:500 1rem var(--body);display:flex;flex-direction:column;gap:2px}
.mode small{color:var(--muted);font-size:.8rem;font-weight:400}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.btn{border:0;border-radius:14px;padding:14px 20px;font:600 1.15rem var(--display);cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none;border:2px solid var(--accent)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* game */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.pill.streak{border-color:var(--gold);background:var(--gold-soft)}
.hud .x{margin-inline-start:auto;background:none;border:0;color:var(--muted);font:500 .95rem var(--body);cursor:pointer;padding:6px}
.qbar{height:8px;background:var(--paper);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;position:relative}
.prompt{font-size:.95rem;color:var(--muted)}
.word{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.1;overflow-wrap:anywhere}
.speak{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;font:500 .9rem var(--body)}
.hintbox{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:1.05rem;width:100%;box-sizing:border-box}
.hintbox .emo{font-size:1.6rem;margin-inline-end:6px;vertical-align:middle}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--paper);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:16px 8px;font:500 1.3rem var(--body);color:var(--ink);cursor:pointer;min-height:68px;transition:transform .1s}
.opt.lat{font-family:var(--display)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.gone{opacity:.25}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.typ{display:flex;flex-direction:column;gap:10px}
.typ input{font:600 1.6rem var(--display);text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);direction:ltr;width:100%;box-sizing:border-box}
.typ input:focus{outline:none;border-color:var(--accent)}
.typ input.right{border-color:var(--good);background:var(--good-soft)}
.typ input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.hintbtn{background:var(--gold-soft);color:var(--ink);border:2px solid var(--gold);border-radius:14px;padding:12px;font:600 1rem var(--body);cursor:pointer;flex:1}
.hintbtn:disabled{opacity:.45;cursor:default}
.feedback{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:center}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback b{font-family:var(--display);font-size:1.4rem}
.feedback .fix{color:var(--ink);font-size:1.1rem}
.float{position:absolute;top:10px;inset-inline-end:16px;font:700 1.5rem var(--display);color:var(--gold);animation:up 1s ease-out forwards;pointer-events:none}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.08)}}
.banner{position:fixed;inset-inline:0;top:30%;text-align:center;pointer-events:none;z-index:5}
.banner span{display:inline-block;background:var(--gold);color:#1B2547;font:700 2rem var(--display);padding:12px 26px;border-radius:20px;animation:ban 1.6s ease-out forwards;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@keyframes ban{0%{transform:scale(.3) rotate(-8deg);opacity:0}20%{transform:scale(1.1) rotate(3deg);opacity:1}35%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.lbrow{justify-content:flex-start}.lbrow.me{background:var(--accent-soft);border-radius:12px;padding-inline:8px}
.lbn{width:28px;text-align:center;font:600 1.1rem var(--display);color:var(--muted)}.lbs{font-weight:700;white-space:nowrap}
.row .en{font-size:1.15rem;font-weight:500}
.dots{display:flex;gap:3px;direction:ltr}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.dots.miss i.on{background:var(--gold)}
.cat-h{font-family:var(--display);font-weight:600;font-size:1.1rem;margin-top:8px}
.big{font:700 3rem var(--display);color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.center{text-align:center}
.toggle{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.iconbtn{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--ink);cursor:pointer;font:500 .9rem var(--body)}
.learn{background:var(--paper);border:2px dashed var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
.tip{font-size:1.02rem;line-height:1.55}
.ex{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.ex .en{font-size:1.2rem;font-weight:500}
.exhe{color:var(--muted);font-size:.92rem}
.mini{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:50%;width:38px;height:38px;flex:none;cursor:pointer;font-size:1rem;display:inline-grid;place-items:center;vertical-align:middle}
.mini.on,.speak.on,.bigear.on{border-color:var(--accent);background:var(--accent-soft)}
.mini.slow,.speak.slow,.bigear.slow{border-color:var(--gold);background:var(--gold-soft)}
.bigear{font-size:3rem;width:110px;height:110px;border-radius:50%;border:3px solid var(--accent);background:var(--accent-soft);cursor:pointer;color:var(--ink)}
.note{color:var(--ink);font-size:.92rem}
.rowtip{font-size:.85rem;color:var(--muted);padding:0 2px 10px;border-bottom:1px solid var(--line)}
.list .row:has(+ .rowtip){border-bottom:0}
.modes{grid-template-columns:repeat(2,1fr)}

/* ---- tactile buttons + menu refresh ---- */
:root{--edge:#B8C5E6;--c1:#5B3FE0;--c2:#2F7DE1;--c3:#E0533F;--c4:#139A5E;--c5:#C98A06;--c6:#C2408F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--edge:#0A0F22;--c1:#9C86FF;--c2:#6AA8FF;--c3:#FF8A78;--c4:#3DD08E;--c5:#FFC24D;--c6:#FF7EC4}}
:root[data-theme="dark"]{--edge:#0A0F22;--c1:#9C86FF;--c2:#6AA8FF;--c3:#FF8A78;--c4:#3DD08E;--c5:#FFC24D;--c6:#FF7EC4}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus:not(:focus-visible){outline:none}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tac{border:2px solid var(--line);background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--edge);transition:transform .07s ease-out,box-shadow .07s ease-out;cursor:pointer}
.tac:active:not(:disabled),.tac.press:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--edge)}
.btn:active,.btn.press{transform:translateY(4px);box-shadow:0 0 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn{box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .07s,box-shadow .07s}
.btn.ghost{background:var(--paper);box-shadow:0 4px 0 var(--edge);border:2px solid var(--line);color:var(--accent)}
.opt{transition:transform .07s,border-bottom-width .07s}
.opt.press:not(:disabled),.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.speak{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:9px 18px 9px 16px;font:600 1rem var(--body);background:var(--paper);color:var(--accent)}
.mini{width:42px;height:42px;border-radius:50%;color:var(--accent);background:var(--paper);display:inline-grid;place-items:center;padding:0}
.mini .ic{width:20px;height:20px}
.bigear{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--accent);border:0;box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.bigear .ic{width:52px;height:52px}
.bigear:active,.bigear.press{transform:translateY(6px);box-shadow:0 0 0 transparent}
.bigear .turtle{font-size:3rem}
.mini.on,.speak.on,.bigear.on{animation:ring .9s ease-out}
@keyframes ring{from{outline:3px solid var(--accent);outline-offset:0}to{outline:3px solid transparent;outline-offset:10px}}
.mini.slow,.speak.slow{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.bigear.slow{background:var(--gold);box-shadow:0 6px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.roundbtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--accent);flex:none;padding:0}
.roundbtn[aria-pressed="true"]{color:var(--muted)}
h2.sec{font:600 1.1rem var(--display);margin:0}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat .si{font-size:1.2rem;color:inherit}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{display:flex;flex-direction:row;align-items:center;gap:9px;padding:10px 9px;border-radius:16px;text-align:start;font:500 1rem var(--body)}
.mode .mt{display:flex;flex-direction:column;min-width:0;gap:1px}
.mode b{font-weight:600;font-size:.98rem;line-height:1.2}
.mode small{color:var(--muted);font-size:.8rem}
.tile{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--k);background:color-mix(in srgb,var(--k) 15%,transparent)}
.tile .glyph{font:700 1.45rem var(--display);line-height:1}
.m-mix{--k:var(--c1)}.m-e2h{--k:var(--c2)}.m-h2e{--k:var(--c3)}.m-heType{--k:var(--c4)}.m-spell{--k:var(--c5)}.m-ear{--k:var(--c6)}
.mode[aria-pressed="true"]{border-color:var(--k);background:color-mix(in srgb,var(--k) 9%,var(--paper));box-shadow:0 4px 0 color-mix(in srgb,var(--k) 55%,var(--edge))}
.mode[aria-pressed="true"] .tile{background:var(--k);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:8px 12px;font:500 .95rem var(--body)}
.chip small{font-size:.75rem;color:var(--muted);background:var(--bg);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.chip[aria-pressed="true"] small{background:rgba(255,255,255,.22);color:#fff}
.chip[aria-pressed="false"]{opacity:.75}
.btn.go{font-size:1.35rem;padding:16px}
.withic{display:flex;align-items:center;justify-content:center;gap:8px}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.85rem}
.tips li{display:flex;gap:8px;align-items:center}
.hintbtn{box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 60%,var(--edge));border-color:var(--gold);background:var(--gold-soft)}
.hintbtn:disabled{box-shadow:none;transform:translateY(4px)}

/* ---- players + levels ---- */
.who{display:flex;align-items:center;gap:10px;border-radius:99px;padding:5px 16px 5px 6px;font:inherit;text-align:start}
.wn{display:flex;flex-direction:column;line-height:1.15}
.wn b{font:600 1.05rem var(--display)}
.wn small{color:var(--muted);font-size:.75rem}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;flex:none;background:color-mix(in srgb,var(--k,var(--accent)) 22%,var(--paper));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--k,var(--accent)) 45%,transparent)}
.av.big{width:68px;height:68px;font-size:2.4rem}
.av.huge{width:104px;height:104px;font-size:3.8rem}
.av.plus{font:500 2.4rem var(--display);color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.bounce{animation:bnc .45s}
@keyframes bnc{30%{transform:scale(1.18) rotate(-6deg)}60%{transform:scale(.95)}}
.levels{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory;margin-inline:-2px}
.lvl{flex:0 0 min(62%,230px);scroll-snap-align:start;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"e t" "b b" "c c";gap:6px 10px;padding:12px;border-radius:18px;text-align:start;font:inherit}
.lvl .le{grid-area:e;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.6rem;background:var(--bg)}
.lvl .lt{grid-area:t;display:flex;flex-direction:column;justify-content:center;min-width:0}
.lvl .lt small{color:var(--muted);font-size:.78rem}
.lvl .lt b{font:600 1.15rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .lbar{grid-area:b;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.lvl .lbar i{display:block;height:100%;background:var(--good);border-radius:99px}
.lvl .lc{grid-area:c;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,var(--edge))}
.lvl[aria-pressed="true"] .le{background:var(--paper)}
.lvl.soon{border:2px dashed var(--line);background:transparent;box-shadow:none;color:var(--muted);flex-basis:min(48%,180px)}
.lvl.soon .le{color:var(--muted)}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pl-wrap{position:relative;display:flex}
.player{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 14px;border-radius:20px;font:inherit}
.player b{font:600 1.15rem var(--display);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player small{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.player[aria-current="true"]{border-color:var(--accent)}
.player.add{border-style:dashed;box-shadow:0 4px 0 var(--edge)}
.pl-tools{position:absolute;top:6px;inset-inline-end:6px;display:flex;flex-direction:column;gap:6px}
.pl-tools .mini{width:36px;height:36px}
.mini.danger,.btn.danger{color:var(--bad)}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 55%,#000)}
.confirm{border-color:var(--bad)}
.av-preview{display:flex;justify-content:center}
.fl{font-weight:600;font-size:.92rem}
.tin{font:500 1.2rem var(--body);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
.tin:focus{outline:none;border-color:var(--accent)}
.err{color:var(--bad);font-size:.88rem;margin-top:-6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border-radius:14px;padding:12px 6px;font:600 1.05rem var(--body)}

}
// keep the canvas the size of the screen (keyboard, address bar and rotation change it mid-animation); resizing also wipes it
function fitFx(){const w=Math.round(innerWidth*devicePixelRatio),h=Math.round(innerHeight*devicePixelRatio);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
function loop(){
  fitFx();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
  parts=parts.filter(p=>p.y<innerHeight+30&&p.life<220);
  if(parts.length){raf=requestAnimationFrame(loop);return}
  raf=0;cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
}

/* ---------- picking words ---------- */
function pool(){return WORDS.filter(w=>LP.cats.includes(w.cat))}
/* Word groups: new → learning (0-1) → reviewing (2-3) → known (4) → retired (known + 2 clean spot checks) */
function group(w){const st=stOf(w);if(!st||!st.seen)return"new";if(st.ret)return"retired";
  return st.box>=4?"known":st.box>=2?"review":"learn"}
const dueOf=w=>{const st=stOf(w);return st&&st.due!==undefined?st.due:0};
// Plan a whole round up front: guaranteed new words, the words being learned, due reviews, one known-word spot check
function buildRound(){
  const R=++LP.r, P=pool(), by={new:[],learn:[],review:[],known:[],retired:[]};
  P.forEach(w=>by[group(w)].push(w));
  const isDue=w=>dueOf(w)<=R, old=(a,b)=>dueOf(a)-dueOf(b)||(stOf(a).last||0)-(stOf(b).last||0);
  const deck=[], used=new Set(), add=(w,kind,times=1)=>{used.add(w.id);for(let i=0;i<times;i++)deck.push({w,kind,copy:i})};
  const room=()=>ROUND-deck.length;
  // new words: rotate through categories, the one visited longest ago goes first; words in list order
  const takeNew=n=>{let got=0;
    while(got<n&&room()>=2){
      const cats=[...new Set(by.new.filter(w=>!used.has(w.id)).map(w=>w.cat))].sort((a,b)=>(LP.catAt[a]||0)-(LP.catAt[b]||0));
      if(!cats.length)break;
      const w=by.new.find(x=>x.cat===cats[0]&&!used.has(x.id));
      LP.catAt[w.cat]=R+got/100;add(w,"new",2);got++}
    return got};
  const braking=by.learn.length>LEARN_BRAKE;
  const newGot=takeNew(braking?1:NEW_PER_ROUND);
  // learning words: most overdue first, up to 5 (plus the slots the brake freed), then a second look for the top ones
  const learnCap=Math.min(room(),5+(braking?2*(NEW_PER_ROUND-newGot):0));
  const learn=by.learn.filter(isDue).sort(old);
  const learnPick=learn.slice(0,learnCap);learnPick.forEach(w=>add(w,"learn"));
  for(const w of learnPick){if(deck.filter(d=>d.kind==="learn").length>=learnCap)break;add(w,"learn")}
  deck.forEach((d,i)=>{if(d.kind==="learn")d.copy=deck.slice(0,i).filter(x=>x.w.id===d.w.id).length});
  // reviews that are due, oldest first
  by.review.filter(isDue).sort(old).slice(0,Math.min(3,room())).forEach(w=>add(w,"review"));
  // one spot check of a known (or retired) word that has waited longest
  const spot=[...by.known,...by.retired].filter(isDue).sort(old)[0];
  if(spot&&room()>0)add(spot,"known");
  // leftovers: more new words, then other due reviews, then whatever is closest to due
  if(!braking)takeNew(NEW_MAX-newGot);
  by.review.filter(w=>isDue(w)&&!used.has(w.id)).sort(old).forEach(w=>{if(room()>0)add(w,"review")});
  [...by.learn,...by.review].filter(w=>!used.has(w.id)).sort(old).forEach(w=>{if(room()>0)add(w,stOf(w).box>=2?"review":"learn")});
  // nearly everything known and nothing due: fill with the known words she hasn't seen for longest
  [...by.known,...by.retired].filter(w=>!used.has(w.id)).sort(old).forEach(w=>{if(room()>0)add(w,"known")});
  return orderRound(deck);
}
// Order: 2 easy warm-ups first, a known word last, new words spread out, rechecks ~5 questions later, ≥3 between repeats
function orderRound(deck){
  const easy=d=>d.kind==="review"||d.kind==="known";
  let rest=deck.slice();
  const end=rest.find(d=>d.kind==="known")||(rest.filter(easy).length>2?rest.filter(easy).pop():null);
  if(end)rest.splice(rest.indexOf(end),1);
  const warm=shuffle(rest.filter(easy)).slice(0,2);rest=rest.filter(d=>!warm.includes(d));
  // try a few arrangements, keep the one with the fewest repeats closer than 3 questions apart
  let bestSeq=null,bestBad=1e9;
  for(let t=0;t<40&&bestBad>0;t++){
    const seq=[...warm], last={}, placed=new Set(), left=shuffle(rest.slice());let bad=0;
    warm.forEach((d,i)=>last[d.w.id]=i);
  const intros=rest.filter(d=>d.kind==="new"&&d.copy===0).length;
  const step=Math.max(1,Math.floor((rest.length-5)/Math.max(1,intros)));
  let nextNew=seq.length;
  while(left.length){
    const pos=seq.length;
    const ok=left.filter(d=>d.copy===0||placed.has(d.w.id+":"+(d.copy-1)));
    let best=null,bs=-Infinity;
    for(const d of ok){
      const gap=pos-(last[d.w.id]??-99);
      let sc=gap>=4?0:-1000+gap;
      if(d.copy>0)sc+=gap>=4?100+gap:10;
      else if(d.kind==="new")sc+=pos>=nextNew?60:5;
      else sc+=20+Math.random()*10;
      // a word that still needs a second look must leave room for it (≥4 slots after)
      if(left.some(x=>x.w.id===d.w.id&&x.copy>d.copy)){sc+=15;if(left.length-1<4)sc-=500}
      if(sc>bs){bs=sc;best=d}}
    if(best.kind==="new"&&best.copy===0)nextNew=pos+step;
    if(pos-(last[best.w.id]??-99)<4)bad++;
    seq.push(best);last[best.w.id]=pos;placed.add(best.w.id+":"+best.copy);left.splice(left.indexOf(best),1);
  }
    if(bad<bestBad){bestBad=bad;bestSeq=seq}
  }
  // last resort: skip a second look rather than show the same word again too soon
  const seq=[],at={};
  (bestSeq||warm).forEach(d=>{if(d.copy>0&&seq.length-(at[d.w.id]??-99)<4)return;at[d.w.id]=seq.length;seq.push(d)});
  if(end)seq.push(end);
  return seq;
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// Wrong options come from look-alike / sound-alike / related-meaning words chosen per word
function options(w){
  const out=[{en:w.en,he:w.he,right:true}],seenHe=new Set([w.he]),seenEn=new Set([w.en]);
  for(const en of w.near){const he=heOf(en);if(!he||seenHe.has(he)||seenEn.has(en))continue;seenHe.add(he);seenEn.add(en);out.push({en,he});}
  for(const x of shuffle(WORDS.filter(x=>x.cat===w.cat))){if(out.length>=4)break;if(seenHe.has(x.he))continue;seenHe.add(x.he);out.push({en:x.en,he:x.he})}
  return shuffle(out.slice(0,4));
}

/* ---------- answer checking ---------- */
const normHe=s=>s.replace(/[֑-ׇ]/g,"").replace(/[^א-ת0-9]/g,"").replace(/ך/g,"כ").replace(/ם/g,"מ").replace(/ן/g,"נ").replace(/ף/g,"פ").replace(/ץ/g,"צ").replace(/^ה(?=.{3,})/,"");
const normEn=s=>s.toLowerCase().replace(/[^a-z]/g,"");
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
// returns "exact" | "close" | false
function judge(input,accepted,norm){
  const v=norm(input);if(!v)return false;
  const list=accepted.map(norm);
  if(list.includes(v)||list.includes(norm("ה"+input)))return "exact";
  if(list.some(a=>a.length>=4&&lev(v,a)<=1))return "close";
  return false;
}

    if(p){Object.assign(p,{name,av,g:gen});saveP();if(p.lb)lbPush(p,store.get(uKey(p.id),freshUser()).score);if(P.cur===p.id&&S)home();else profiles()}
    else{const nid=newId();P.list.push({id:nid,name,av,g:gen});store.set(uKey(nid),freshUser());loadUser(nid);
      tone([523,659,784],.12,"triangle",.09);home()}};
}

function start(){G={n:0,streak:0,got:0,pts:0,missed:new Set(),deck:buildRound()};G.len=G.deck.length;save();next()}

function next(){
  if(G.n>=G.len)return summary();
  const w=G.deck[G.n].w;G.n++;
  let dir=S.mode;
  if(dir==="mix"){const b=ws(w.id).box;
    const pool=b>=2?["heType","spell","heType","e2h","ear"]:b>=1?["e2h","h2e","heType","ear"]:["e2h","h2e"];
    dir=pool[Math.floor(Math.random()*pool.length)]}
  G.cur={w,dir,hints:0,done:false,opts:["e2h","h2e","ear"].includes(dir)?options(w):null};
  preload(w);
  draw();
}

function hud(){return `<div class="hud">
  <span class="pill">⭐ <span id="sc">${S.score}</span></span>
  <span class="pill ${G.streak>=3?"streak":""}">🔥 ${G.streak}</span>
  <span class="pill">${G.n}/${G.len}</span>
  <button class="x" id="quit">✕ יציאה</button></div>
  <div class="qbar"><i style="width:${(G.n-1)/G.len*100}%"></i></div>`}

function draw(){
  const {w,dir,opts}=G.cur;
  const enShown=dir==="e2h"||dir==="heType";
  const prompt={e2h:"מה הפירוש בעברית?",h2e:"איך אומרים באנגלית?",heType:g("הקלידי","הקלד")+" את הפירוש בעברית",spell:g("כתבי","כתוב")+" את המילה באנגלית",ear:g("הקשיבי","הקשב")+" – מה הפירוש?"}[dir];
  const optsHe=dir!=="h2e";
  const wordHtml=dir==="ear"?`<button class="bigear tac" id="say" aria-label="להשמיע שוב">${SPK}</button>`
    :`<div class="word ${enShown?"en":""}">${esc(enShown?w.en:w.he)}</div>`;
  app.innerHTML=hud()+`
  <div class="card" id="card">
    <div class="prompt">${prompt}</div>
    ${wordHtml}
    ${enShown?`<button class="speak tac" id="say">${SPK}<span>להשמיע</span></button>`:""}
    <div id="hint" style="width:100%;display:flex;flex-direction:column;gap:8px"></div>
  </div>
  ${dir==="spell"||dir==="heType"
   ?`<form class="typ" id="tf"><input id="ans" dir="${dir==="spell"?"ltr":"rtl"}" lang="${dir==="spell"?"en":"he"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${dir==="spell"?"type here…":g("הקלידי כאן…","הקלד כאן…")}"><button class="btn" id="check">בדיקה ✓</button></form>`
   :`<div class="opts">${opts.map((o,i)=>`<button class="opt ${optsHe?"":"lat en"}" data-i="${i}">${esc(optsHe?o.he:o.en)}</button>`).join("")}</div>`}
  <div class="actions"><button class="hintbtn tac" id="h1">💡 רמז (‎-3)</button><button class="hintbtn tac" id="h2">${dir==="spell"||dir==="heType"?"🔤 אותיות (‎-5)":"✂️ להעלים 2 (‎-5)"}</button></div>
  <div id="fb"></div>`;
  $("#quit").onclick=home;
  const sb=$("#say");if(sb)sb.onclick=()=>sayWord(w,sb);
  if((enShown||dir==="ear")&&S.sound)setTimeout(()=>sayWord(w,sb,true),250);
  $("#h1").onclick=()=>hint(1);$("#h2").onclick=()=>hint(2);
  if(dir==="spell"||dir==="heType"){const i=$("#ans");i.focus();$("#tf").onsubmit=e=>{e.preventDefault();checkTyped()}}
  else app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.i,b));
}

function hint(level){
  const c=G.cur;if(c.done)return;
  const {w,dir}=c;const box=$("#hint");
  if(level===1&&!c.h1){c.h1=1;c.hints+=3;sHint();
    box.insertAdjacentHTML("beforeend",`<div class="hintbox"><span class="emo">${w.emo}</span>${esc(w.clue)}</div>`);$("#h1").disabled=true}
  if(level===2&&!c.h2){c.h2=1;c.hints+=5;sHint();$("#h2").disabled=true;
    if(dir==="spell"){const n=Math.max(1,Math.ceil(w.en.length/2));
      box.insertAdjacentHTML("beforeend",`<div class="hintbox en" style="font-size:1.4rem;letter-spacing:.15em">${esc(w.en.slice(0,n))}${"_ ".repeat(w.en.length-n)}</div>`)}
    else if(dir==="heType"){const h=w.he.split(" / ")[0];
      box.insertAdjacentHTML("beforeend",`<div class="hintbox">מתחיל באות <b style="font-size:1.4rem">${esc(h[0])}</b>${/^\d/.test(h)?"":` · ${h.length} אותיות`}</div>`)}
    else{const btns=[...app.querySelectorAll(".opt")];
      shuffle(btns.filter(b=>!c.opts[+b.dataset.i].right)).slice(0,2).forEach(b=>{b.disabled=true;b.classList.add("gone")});
      const ans=dir==="h2e"?w.en:w.he;
      box.insertAdjacentHTML("beforeend",`<div class="hintbox">התשובה מתחילה ב־<b class="${dir==="h2e"?"en":""}">${esc(ans[0])}</b></div>`)}
  }
}

function choose(i,btn){
  const c=G.cur;if(c.done)return;
  const ok=!!c.opts[i].right;
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(c.opts[+b.dataset.i].right)b.classList.add("right")});
  if(!ok)btn.classList.add("wrong");
  result(ok?"exact":false,null,c.opts[i]);
}
function checkTyped(){
  const c=G.cur;if(c.done)return;const i=$("#ans");if(!i.value.trim()){i.focus();return}
  const r=c.dir==="spell"?judge(i.value,[c.w.en],normEn):judge(i.value,c.w.alt,normHe);
  i.classList.add(r?"right":"wrong");i.disabled=true;$("#check").remove();
  result(r,i.value);
}

function learnBlock(w){
  return `<div class="learn">
    <div class="tip">💡 ${esc(w.tip)}</div>
    <div class="ex"><button class="mini tac" id="exs" aria-label="להשמיע את המשפט">${SPK}</button><div><div class="en">${esc(w.ex)}</div><div class="exhe">${esc(w.exHe)}</div></div></div>
  </div>`;
}

function result(r,typed,chosen){
  const c=G.cur;c.done=true;const st=ws(c.w.id);st.seen++;S.q++;st.last=S.q;
  const R=LP.r, typing=c.dir==="spell"||c.dir==="heType";
  const ok=!!r;
  $("#h1").disabled=true;$("#h2").disabled=true;
  const card=$("#card");let html;
  const pair=`<span class="en" style="font-weight:600">${esc(c.w.en)}</span> = ${esc(c.w.he)} <span>${c.w.emo}</span> <button class="mini tac" id="ws" aria-label="להשמיע את המילה">${SPK}</button>`;
  if(ok){
    G.streak++;G.got++;
    let pts=r==="close"?5:Math.max(2,10-c.hints);const bonus=Math.min(G.streak-1,5);pts+=bonus;
    if(G.streak%5===0)pts+=20;
    S.score+=pts;G.pts+=pts;S.best=Math.max(S.best,G.streak);
    if(c.hints){st.due=R+1}                       // hint: keep level, see it again next round
    else if(r==="close"){st.due=R+GAP[st.box]}     // nearly right spelling: keep level
    else{
      if(st.box>=4){st.ok=(st.ok||0)+1;if(st.ok>=2)st.ret=1}   // clean spot checks → retire
      else if(st.box<3||typing||S.mode!=="mix")st.box++;       // in mixed mode, "known" needs a typed answer
      st.due=R+(st.ret?RETIRE_GAP:GAP[st.box])}
    card.classList.add("pop");card.insertAdjacentHTML("beforeend",`<div class="float">+${pts}</div>`);
    sGood();
    if(G.streak%5===0)setTimeout(()=>{sFan();confetti();banner(`🔥 רצף ${G.streak}! +20`)},150);
    else if(c.hints===0&&Math.random()<.25)confetti(30);
    const cheers=["מעולה!","כל הכבוד!","יופי!",g("אלופה!","אלוף!"),"בדיוק!","מדהים!","וואו!"];
    const head=r==="close"?"כמעט מושלם! רק "+g("שימי","שים")+" לב לאיות":cheers[Math.floor(Math.random()*cheers.length)];
    html=`<div class="feedback good"><b>${head}</b><div class="fix">${pair}</div>
      ${r==="close"?`<div class="note">כתבת: <span class="${c.dir==="spell"?"en":""}">${esc(typed)}</span></div>`:""}
      ${G.streak>1?`<div>רצף: ${G.streak} 🔥${bonus?` (בונוס +${bonus})`:""}</div>`:""}</div>${learnBlock(c.w)}`;
  }else{
    G.streak=0;st.miss++;st.box=Math.max(0,st.box-(typing?1:2));st.ok=0;st.ret=0;st.due=R+1;G.missed.add(c.w.id);
    card.classList.add("shake");sBad();
    let mix="";
    if(chosen){const cw=BY_EN[chosen.en];mix=`<div class="note">בחרת: <span class="en">${esc(chosen.en)}</span> = ${esc(chosen.he)}${cw?` ${cw.emo}`:""}</div>`}
    else if(typed)mix=`<div class="note">כתבת: <span class="${c.dir==="spell"?"en":""}">${esc(typed)}</span></div>`;
    html=`<div class="feedback bad"><b>כמעט! זאת התשובה הנכונה:</b>
      <div class="fix" style="font-size:1.35rem">${pair}</div>${mix}
      <div class="note">המילה הזו תחזור עוד מעט</div></div>${learnBlock(c.w)}`;
  }
  save();
  $("#sc").textContent=S.score;
  $("#fb").innerHTML=html+`<div class="actions" style="margin-top:12px"><button class="btn" id="nx">${G.n>=G.len?"לסיכום ←":"הבאה ←"}</button></div>`;
  const wb=$("#ws"),eb=$("#exs");wb.onclick=()=>sayWord(c.w,wb);eb.onclick=()=>saySent(c.w,eb);
  if(!ok||c.dir==="h2e"||c.dir==="spell")setTimeout(()=>sayWord(c.w,wb,true),ok?450:300);
  const nx=$("#nx");nx.focus({preventScroll:true});nx.onclick=next;
  setTimeout(()=>$("#fb").scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"}),60);
}

function summary(){
  const pct=Math.round(G.got/G.len*100);
  const m=WORDS.filter(w=>mastered(w.id)).length;
  const msg=pct===100?"מושלם! 🏆":pct>=80?"עבודה מצוינת! 🌟":pct>=60?"יפה מאוד! ממשיכים 💪":"מתאמנים ומשתפרים 🌱";
  if(pct>=80){sFan();confetti(140)}
  lbPush(me(),S.score);
  const miss=[...G.missed].map(id=>WORDS[id]);
  app.innerHTML=`
  <section class="panel center">
    <div class="label">סוף סיבוב</div>
    <h1>${msg}</h1>
    <div class="big">${G.got}/${G.len}</div>
    <div class="stats"><div class="stat"><b>+${G.pts}</b><span>נקודות בסיבוב</span></div><div class="stat"><b>${S.score}</b><span>סה״כ</span></div><div class="stat"><b>${m}/${WORDS.length}</b><span>${g("שולטת","שולט")}</span></div></div>
  </section>
  ${miss.length?`<section class="panel"><div class="label">מילים לחזור עליהן</div><div class="list">${miss.map(w=>`<div class="row"><button class="mini tac" data-say="${w.id}" aria-label="להשמיע">${SPK}</button><span class="en" style="flex:1">${esc(w.en)}</span><span>${w.emo} ${esc(w.he)}</span></div><div class="rowtip">${esc(w.tip)}</div>`).join("")}</div><p class="sub" style="font-size:.85rem">הן יופיעו שוב בסיבוב הבא.</p></section>`:""}
  <div class="actions"><button class="btn" id="again">עוד סיבוב ▶</button><button class="btn ghost" id="hm">לתפריט</button></div>`;
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>sayWord(WORDS[+b.dataset.say],b));
  $("#again").onclick=start;$("#hm").onclick=home;
}

function board(){
  const u=me();
  app.innerHTML=`<div class="toprow"><h1>טבלת הכיתה 🏆</h1><button class="iconbtn tac" id="bk">→ חזרה</button></div>
  <div id="lbj"></div>
  <section class="panel"><div class="list" id="lbl"><p class="sub center">טוען…</p></div></section>`;
  $("#bk").onclick=home;
  const join=$("#lbj");
  if(!u.lb){
    const ok=LB_NAME.test(u.name.trim());
    join.innerHTML=`<section class="panel center"><b>רוצה להופיע בטבלה?</b>
      <p class="sub">בטבלה יופיעו רק השם, הדמות והנקודות: <span class="av" style="--k:${avColor(u.av)};display:inline-grid;vertical-align:middle">${u.av}</span> ${esc(u.name)} · ⭐ ${S.score}</p>
      ${ok?`<button class="btn" id="jn">כן, ${g("תוסיפי","תוסיף")} אותי</button>`
          :`<p class="err" style="margin:0">אפשר להצטרף רק עם שם קצר באותיות ובמספרים. ${g("שני","שנה")} את השם במסך השחקנים.</p>`}
      <div class="err" id="jer" hidden></div></section>`;
    const jn=$("#jn");if(jn)jn.onclick=()=>{jn.disabled=true;const t=lbToken();
      lbCall("lb_submit",{p_token:t,p_name:u.name.trim(),p_av:u.av,p_score:S.score|0})
        .then(()=>{u.lb=t;saveP();tone([523,659,784],.12,"triangle",.09);board()})
        .catch(()=>{jn.disabled=false;const e=$("#jer");e.hidden=false;e.textContent="לא הצלחנו להצטרף. בדקו שיש אינטרנט ונסו שוב."})};
  }
  lbPush(u,S.score).then(()=>lbCall("lb_top")).then(rows=>{
    const l=$("#lbl");if(!l)return;
    if(!rows||!rows.length){l.innerHTML=`<p class="sub center">עוד אין אף אחד בטבלה. ${g("תהיי","תהיה")} ${g("הראשונה","הראשון")}!</p>`;return}
    const medal=["🥇","🥈","🥉"];
    l.innerHTML=rows.map((r,i)=>{const mine=u.lb&&r.name===u.name.trim()&&r.av===u.av;
      return `<div class="row lbrow${mine?" me":""}"><span class="lbn">${medal[i]||i+1}</span><span class="av" style="--k:${avColor(r.av)}">${esc(r.av)}</span>
        <b style="flex:1">${esc(r.name)}</b><span class="lbs">⭐ ${r.score}</span></div>`}).join("")
      +(u.lb?`<button class="btn ghost" id="lv" style="margin-top:12px">להסתיר אותי מהטבלה</button>`:"");
    const lv=$("#lv");if(lv)lv.onclick=()=>{lv.disabled=true;lbCall("lb_leave",{p_token:u.lb}).then(()=>{delete u.lb;saveP();board()}).catch(()=>{lv.disabled=false})};
  }).catch(()=>{const l=$("#lbl");if(l)l.innerHTML=`<p class="sub center">אין חיבור לטבלה כרגע. נסו שוב מאוחר יותר.</p>`});
}

function listView(){
  app.innerHTML=`<div class="toprow"><h1>כל המילים</h1><button class="iconbtn tac" id="bk">→ חזרה</button></div>
  <p class="sub">${esc(L.name)} · ${esc(L.title)}. לחיצה על 🔈 משמיעה את המילה. הנקודות מראות כמה טוב ${g("את יודעת","אתה יודע")} כל מילה.</p>
  ${CATS.map(cat=>`<section class="panel"><div class="cat-h">${cat}</div><div class="list">${WORDS.filter(w=>w.cat===cat).map(w=>{const s=stOf(w)||{box:0,seen:0};
    return `<div class="row"><button class="mini tac" data-say="${w.id}" aria-label="להשמיע">${SPK}</button><span class="en" style="flex:1">${esc(w.en)}</span><span style="flex:1">${esc(w.he)}</span><span class="dots ${s.seen&&s.box<3?"miss":""}">${[0,1,2,3].map(i=>`<i class="${i<s.box?"on":""}"></i>`).join("")}</span></div>`}).join("")}</div></section>`).join("")}
  <button class="btn ghost" id="reset">איפוס ההתקדמות ב${esc(L.name)}</button><div id="rc"></div>`;
  app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>sayWord(WORDS[+b.dataset.say],b));
  $("#bk").onclick=home;
  $("#reset").onclick=()=>{$("#rc").innerHTML=`<div class="panel center"><b>למחוק את ההתקדמות של ${esc(me().name)} ב${esc(L.name)}?</b><p class="sub">הנקודות שנצברו נשארות.</p><div class="actions"><button class="btn" id="y">כן, לאפס</button><button class="btn ghost" id="n">ביטול</button></div></div>`;
    $("#y").onclick=()=>{LP.w={};LP.r=0;LP.catAt={};save();home()};$("#n").onclick=()=>$("#rc").innerHTML=""};
}
// physical-button press: hold the pressed look at least 110ms so quick taps show it
document.addEventListener("pointerdown",e=>{const b=e.target.closest("button.tac,button.btn,button.opt");if(!b||b.disabled)return;
  const t0=performance.now();b.classList.add("press");
  const up=()=>{["pointerup","pointercancel","pointerleave"].forEach(k=>b.removeEventListener(k,up));
    setTimeout(()=>b.classList.remove("press"),Math.max(0,110-(performance.now()-t0)))};
  ["pointerup","pointercancel","pointerleave"].forEach(k=>b.addEventListener(k,up))},{passive:true});
// boot: one player -> straight in; several -> pick who is playing
if(P.list.length===1)loadUser(P.list[0].id);
if(P.list.length===1)home();else profiles();
</script>

</body></html>
